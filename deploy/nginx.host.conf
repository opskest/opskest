# Opskest host nginx example. Replace opskest.example.com with your hostname.
# The app publishes only 127.0.0.1:8085; this proxy owns public ports 80/443.
# Complete first-admin setup privately before opening public access.
#
# Install, check the configuration, and reload nginx:
#   sudo cp deploy/nginx.host.conf /etc/nginx/sites-available/opskest
#   sudo ln -s /etc/nginx/sites-available/opskest /etc/nginx/sites-enabled/opskest
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# This example starts with HTTP only. Add HTTPS with your existing certificate
# workflow (for example, certbot --nginx -d your-real-hostname). Verify the
# resulting HTTPS listener, redirect, and renewal. Set APP_URL to that origin.
# If OPSKEST_PORT is not 8085, update every proxy_pass below.
# APP_URL must be exactly the public origin (scheme, host and port): sign-in is
# refused (403) when the browser's origin differs from it. Opskest does not read
# X-Forwarded-Proto or Host. It does rate-limit public status pages by
# X-Real-IP, which this file sets from $remote_addr.
# Restoring a database from Settings makes Opskest exit; the process manager
# must start it again (see deploy/DEPLOYMENT.md).

server {
    listen 80;
    listen [::]:80;
    server_name opskest.example.com;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # General request body limit. Monitor imports (/api/import/monitors) accept
    # up to 5 MiB in the application, so raise this (or add a location like the
    # upload one below) if you import files larger than 2 MiB.
    client_max_body_size 2m;
    access_log /var/log/nginx/opskest.access.log;
    error_log /var/log/nginx/opskest.error.log;

    # Live dashboard and public status streams must not be buffered.
    location ~ ^/api/(stream|public/pages/[^/]+/stream)$ {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Database restore uploads can be up to 1 GiB; retain the application's
    # own validation limit while allowing multipart framing through nginx.
    location = /api/backups/upload {
        client_max_body_size 1025m;
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 5m;
        proxy_read_timeout 5m;
    }

    location / {
        proxy_pass http://127.0.0.1:8085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
