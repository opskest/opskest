name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please remove passwords, tokens, webhook URLs and private hostnames from anything you paste.
  - type: input
    id: version
    attributes:
      label: Opskest version
      description: Settings, About & updates, or `opskest version`
    validations: { required: true }
  - type: dropdown
    id: install
    attributes:
      label: How you run it
      options: [Docker Compose, Plain binary on Linux, Plain binary on Windows, Other]
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines or a screenshot
      render: text
